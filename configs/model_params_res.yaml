Architecture:
  CNN_params:
    in_channels: 1
    out_channels: &CNN_out_channels !!int 64
    kernel_size: 5
    stride: 2
    padding: 2
  ResCNN_params:
    in_channels: *CNN_out_channels # = CNN_out_channels
    out_channels: *CNN_out_channels
    kernel_size: 5
    stride: 1
    dropout: 0.4564897206289136
    n_feats: 16
    padding: 2
    n_cnn_layers: 5
  Fully_connected_params:
    in_features: 1024 # n_feats * out_channels
    out_features: &FC_out_features !!int 512
  RNN_params:
    input_size: *FC_out_features
    hidden_size: *FC_out_features 
    num_layers: 4
    bidirectional: True
    dropout: 0.3147392547906197
    rnn_type: 'lstm'
  Attention_params:
    feature_dim: *FC_out_features
    step_dim: 8
  Classifier_params:
    in_features: *FC_out_features # = RNN_input_size
    out_features: 512
    dropout: 0.48890324556429815
    n_class: 18 # num_commands

Settings: 
  Optimizer_Scheduler:
    lr_rate: 5e-4
    weight_decay: 0.0005
    amsgrad: False
    max_lr: 0.07
    div_factor: 125
    max_norm: 1.4
  Other:
    epochs: 100
    batch_size: 64
