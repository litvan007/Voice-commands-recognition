# Настройки звуковых сигналов
sounds:
  # Сигнал при успешном распознавании команды "старт"
  start:
    frequency: 1000  # частота в Гц
    duration: 0.1    # длительность в секундах
    channel: 15      # канал на PCA9685
    
  # Сигнал при успешном распознавании команды "стоп"
  stop:
    frequency: 800   # частота в Гц
    duration: 0.1    # длительность в секундах
    channel: 15      # канал на PCA9685
    
  # Сигнал при начале движения роборуки
  action_start:
    frequency: 1200  # частота в Гц
    duration: 0.05   # длительность в секундах
    channel: 15      # канал на PCA9685
    
  # Сигнал при завершении движения роборуки
  action_end:
    frequency: 1200  # частота в Гц
    duration: 0.05   # длительность в секундах
    channel: 15      # канал на PCA9685
    
  # Сигнал при неудачном распознавании
  recognition_failed:
    frequency: 500   # частота в Гц
    duration: 0.2    # длительность в секундах
    channel: 15      # канал на PCA9685 